[package]
name = "xml5ever"
authors = ["The xml5ever project developers"]
description = "Push based streaming parser for XML."
documentation = "https://docs.rs/xml5ever"
homepage = "https://github.com/servo/html5ever/blob/main/xml5ever/README.md"
readme = "README.md"
keywords = ["xml", "xml5", "parser", "parsing"]
exclude = ["xml5lib-tests/*"]
categories = ["parser-implementations", "web-programming"]
version = "0.41.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/html5ever"
edition = "2021"
rust-version = "1.85"

[features]
trace_tokenizer = []
serde = ["markup5ever/serde"]
# Surfaces byte-accurate source positions; see markup5ever for full description.
source-positions = ["markup5ever/source-positions"]

[dependencies]
markup5ever = { version = "0.41.0", path = "../markup5ever" }
log = "0.4"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "xml5ever"
harness = false
